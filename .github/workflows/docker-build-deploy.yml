name: Build, Push, and Deploy Container

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - 'api/**'
      - 'Dockerfile'
      - '.github/workflows/docker-build-deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  RESOURCE_GROUP: study-tracker-rg
  APP_SERVICE_NAME: study-tracker-prod-app

permissions:
  id-token: write   # required for OIDC token exchange
  contents: read
  packages: write    # required to push images to ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (lowercase)
        id: meta
        run: echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point App Service at the new image
        run: |
          az webapp config container set \
            --name "$APP_SERVICE_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --container-image-name "${{ needs.build-and-push.outputs.image }}:${{ github.sha }}"

      - name: Restart App Service
        run: |
          az webapp restart \
            --name "$APP_SERVICE_NAME" \
            --resource-group "$RESOURCE_GROUP"
